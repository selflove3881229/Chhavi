<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:Arial,sans-serif;

    min-height:100vh;

    color:white;

    overflow-x:hidden;

    /*
    MULTI COLOUR GRADIENT
    Bahut saare colours ek saath mix
    */

    background:
    radial-gradient(circle at 10% 20%,
        #ff0080 0%,
        transparent 30%),

    radial-gradient(circle at 90% 10%,
        #7928ca 0%,
        transparent 30%),

    radial-gradient(circle at 80% 80%,
        #00c6ff 0%,
        transparent 35%),

    radial-gradient(circle at 20% 90%,
        #00f2fe 0%,
        transparent 30%),

    radial-gradient(circle at 50% 50%,
        #ff6a00 0%,
        #ee0979 30%,
        #240b36 80%);

    background-size:
        180% 180%,
        170% 170%,
        190% 190%,
        180% 180%,
        200% 200%;

    animation:multiGradient 15s ease infinite;

    transition:background 1.5s ease;
}


/*
================================
MULTI COLOUR ANIMATION
================================
*/

@keyframes multiGradient{

    0%{
        background-position:
        0% 50%,
        100% 0%,
        100% 100%,
        0% 100%,
        50% 50%;
    }

    25%{
        background-position:
        50% 0%,
        50% 50%,
        0% 100%,
        100% 50%,
        20% 80%;
    }

    50%{
        background-position:
        100% 50%,
        0% 100%,
        50% 0%,
        100% 0%,
        80% 20%;
    }

    75%{
        background-position:
        50% 100%,
        100% 50%,
        0% 0%,
        50% 100%,
        30% 30%;
    }

    100%{
        background-position:
        0% 50%,
        100% 0%,
        100% 100%,
        0% 100%,
        50% 50%;
    }
}


/*
================================
HEADER
================================
*/

header{

    text-align:center;

    padding:40px 15px 25px;

}

header h1{

    font-size:clamp(30px,7vw,55px);

    text-shadow:
    0 4px 15px rgba(0,0,0,.5);

}

header p{

    margin-top:12px;

    font-size:16px;

}


/*
================================
GALLERY
================================
*/

.gallery{

    width:92%;

    max-width:1200px;

    margin:20px auto 45px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:25px;

}


/*
================================
CARD
================================
*/

.card{

    height:280px;

    border-radius:25px;

    overflow:hidden;

    position:relative;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.25),
        rgba(255,255,255,.05)
    );

    border:
    1px solid
    rgba(255,255,255,.4);

    backdrop-filter:blur(12px);

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.3);

    transition:.4s;

}

.card:hover{

    transform:
    translateY(-10px)
    scale(1.03);

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.45);

}

.card img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}

.card::after{

    content:"❤️ Tap to Open";

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    padding:20px;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );

}


/*
================================
MUSIC BUTTON
================================
*/

.music-control{

    position:fixed;

    right:20px;

    bottom:20px;

    z-index:100;

    width:55px;

    height:55px;

    border:none;

    border-radius:50%;

    background:
    rgba(255,255,255,.25);

    color:white;

    font-size:23px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.4);

}


/*
================================
NEXT PAGE
================================
*/

.next-page-area{

    width:100%;

    text-align:center;

    padding:10px 20px 45px;

}

.next-page-btn{

    display:inline-block;

    padding:15px 38px;

    border-radius:35px;

    background:
    linear-gradient(
        135deg,
        rgba(255,0,128,.5),
        rgba(0,198,255,.4),
        rgba(255,106,0,.5)

    font-size:18px;

    font-weight:bold;

    border:
    1px solid

    transition:.3s;

}

.next-page-btn:hover{

/*
================================
WEBSITE AGE COUNTER
================================
*/

        scale(1.4)

<script>


/* =================================
   WEBSITE CREATED DATE
================================= */

/*
   ⚠️ YAHAN WEBSITE BANNE KI DATE LIKHO

   Example:
   24 September 2026
   Time: 00:00:00

   Agar tumhari actual date alag hai
   to sirf neeche wali date change karo.
*/

const websiteCreated =
new Date("2026-09-28T23:59:00");


/* =================================
   LIVE WEBSITE AGE
================================= */

function updateWebsiteAge(){

    const now = new Date();

    let start = new Date(websiteCreated);

    let years =
        now.getFullYear() -
        start.getFullYear();

    let months =
        now.getMonth() -
        start.getMonth();

    let days =
        now.getDate() -
        start.getDate();

    let hours =
        now.getHours() -
        start.getHours();

    let minutes =
        now.getMinutes() -
        start.getMinutes();

    let seconds =
        now.getSeconds() -
        start.getSeconds();


    /* Seconds */

    if(seconds < 0){

        seconds += 60;

        minutes--;

    }


    /* Minutes */

    if(minutes < 0){

        minutes += 60;

        hours--;

    }


    /* Hours */

    if(hours < 0){

        hours += 24;

        days--;

    }


    /* Days */

    if(days < 0){

        const previousMonth =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                0
            ).getDate();

        days += previousMonth;

        months--;

    }


    /* Months */

    if(months < 0){

        months += 12;

        years--;

    }


    /*
       Counter ko page par show karo
    */

    document.getElementById("years")
        .innerText = years;

    document.getElementById("months")
        .innerText = months;

    document.getElementById("days")
        .innerText = days;

    document.getElementById("hours")
        .innerText = hours;

    document.getElementById("minutes")
        .innerText = minutes;

    document.getElementById("seconds")
        .innerText = seconds;

}


/* Har 1 second update */

updateWebsiteAge();

setInterval(
    updateWebsiteAge,
    1000
);



/* =================================
   MUSIC
================================= */

const bgMusic =
document.getElementById("bgMusic");

const musicBtn =
document.getElementById("musicBtn");

let musicStarted = false;


/*
   Mobile browser autoplay restriction
   ke wajah se first interaction par
   music start hoga.
*/

document.addEventListener(
"click",
function(){

    if(!musicStarted){

        bgMusic.play()
        .then(()=>{

            musicStarted = true;

            musicBtn.innerHTML = "🔊";

        })
        .catch(()=>{});

    }

},
{once:true}
);


function toggleMusic(){

    if(bgMusic.paused){

        bgMusic.play();

        musicBtn.innerHTML =
        "🔊";

    }else{

        bgMusic.pause();

        musicBtn.innerHTML =
        "🔇";

    }

}



/* =================================
   10 DIFFERENT GRADIENTS
================================= */

const gradients = [

`

`,

`
radial-gradient(circle at 10% 90%,#00f2fe,transparent 30%),
radial-gradient(circle at 90% 10%,#ff0080,transparent 30%),
linear-gradient(135deg,#7f00ff,#e100ff,#00c6ff)
`,

`
radial-gradient(circle at 50% 10%,#f6d365,transparent 30%),
radial-gradient(circle at 10% 90%,#ff0080,transparent 30%),
linear-gradient(135deg,#ee0979,#ff6a00,#7928ca)
`,

`
radial-gradient(circle at 90% 50%,#00ff87,transparent 30%),
radial-gradient(circle at 10% 30%,#00c6ff,transparent 30%),
linear-gradient(135deg,#7f00ff,#00f2fe)
`,

`
radial-gradient(circle at 20% 20%,#ff4b1f,transparent 30%),
radial-gradient(circle at 80% 80%,#1fddff,transparent 30%),
linear-gradient(135deg,#ff512f,#dd2476,#1fa2ff)
`,

`
radial-gradient(circle at 50% 50%,#ff00cc,transparent 30%),
radial-gradient(circle at 20% 80%,#3333ff,transparent 30%),
linear-gradient(135deg,#ff0080,#7928ca,#00c6ff)
`,

`
radial-gradient(circle at 80% 20%,#00ff87,transparent 30%),
radial-gradient(circle at 20% 80%,#ff0080,transparent 30%),
linear-gradient(135deg,#240b36,#c31432,#00c6ff)
`,

`
radial-gradient(circle at 50% 0%,#fff700,transparent 30%),
radial-gradient(circle at 0% 100%,#ff0080,transparent 30%),
linear-gradient(135deg,#ff6a00,#ee0979,#240b36)
`,

`
radial-gradient(circle at 100% 0%,#00f2fe,transparent 30%),
radial-gradient(circle at 0% 100%,#f953c6,transparent 30%),
linear-gradient(135deg,#b91d73,#f953c6,#12c2e9)
`,

`
radial-gradient(circle at 30% 30%,#00ff87,transparent 30%),
radial-gradient(circle at 70% 70%,#ff00cc,transparent 30%),
linear-gradient(135deg,#4776e6,#8e54e9,#ff0080)
`

];


let gradientIndex = 0;

let currentVideo = "";

let typingTimer;



/* =================================
   OPEN CARD
================================= */

function openCard(
    image,
    shayari,
    video
){


    /* Popup open */

    document
    .getElementById("popup")
    .classList.add("active");


    /* Image */

    document
    .getElementById("popupImage")
    .src = image;


    /* Save video */

    currentVideo = video;


    /* Reset video */

    const videoElement =
    document.getElementById(
        "memoryVideo"
    );

    videoElement.pause();

    videoElement.src = "";


    document
    .getElementById(
        "videoContainer"
    )
    .style.display = "none";


    document
    .getElementById(
        "watchBtn"
    )
    .style.display = "none";


    /* Typewriter */

    typeWriter(shayari);

}



/* =================================
   TYPEWRITER
================================= */

function typeWriter(text){

    const element =
    document.getElementById(
        "shayariText"
    );

    element.innerHTML = "";

    clearInterval(typingTimer);

    let index = 0;


    typingTimer =
    setInterval(function(){

        if(index < text.length){

            if(text[index] === "\n"){

                element.innerHTML +=
                "<br>";

            }else{

                element.innerHTML +=
                text[index];

            }

            index++;

        }else{

            clearInterval(
                typingTimer
            );


            setTimeout(
            function(){

                document
                .getElementById(
                    "watchBtn"
                )
                .style.display =
                "block";

            },500);

        }

    },45);

}



/* =================================
   WATCH VIDEO
================================= */

function showVideo(){

    const videoContainer =
        document.getElementById("videoContainer");

    const video =
        document.getElementById("memoryVideo");

    // Video source
    video.src = encodeURI("Video/" + currentVideo);

    // Video screen show
    videoContainer.style.display = "flex";

    // Background music OFF
    if(bgMusic){
        bgMusic.pause();
        musicBtn.innerHTML = "🔇";
    }

    // Video PLAY
    video.play().catch(function(error){
        console.log("Video play error:", error);
    });
}



function closeVideo(){

    const video =
        document.getElementById("memoryVideo");

    // Video STOP
    video.pause();
    video.currentTime = 0;

    video.removeAttribute("src");
    video.load();

    // Video screen hide
    document.getElementById("videoContainer")
        .style.display = "none";

    // Background music ON
    if(bgMusic){
        bgMusic.play().then(function(){

            musicBtn.innerHTML = "🔊";

        }).catch(function(error){

            console.log("Music waiting for user interaction...");

        });
    }
}

/* =================================
   CLOSE CARD
================================= */

function closeCard(){

    const video =
    document.getElementById(
        "memoryVideo"
    );


    /* Stop video */

    video.pause();

    video.currentTime = 0;

    video.src = "";

    document.getElementById("videoContainer")
        .style.display = "none";


    /* Popup close */

    document
    .getElementById("popup")
    .classList.remove(
        "active"
    );


    /* Change gradient */

    gradientIndex++;

    if(
        gradientIndex >=
        gradients.length
    ){

        gradientIndex = 0;

    }


    document.body.style.background =
    gradients[gradientIndex];


    /* Music resume */

    bgMusic.play()
    .then(()=>{

        musicBtn.innerHTML =
        "🔊";

    })
    .catch(()=>{});

}



/* =================================
   OUTSIDE CLICK
================================= */

document
.getElementById("popup")
.addEventListener(
"click",
function(e){

    if(e.target === this){

        closeCard();

    }

});



/* =================================
   ESC KEY
================================= */

document.addEventListener(
"keydown",
function(e){

    if(e.key === "Escape"){

        const vc =
        document.getElementById("videoContainer");

        if(vc.style.display === "flex"){
            closeVideo();
        }else{
            closeCard();
        }

    }

});



/* =================================
   FLOATING HEARTS
================================= */

function createHeart(){

    const heart =
    document.createElement(
        "div"
    );

    heart.className =
    "heart";

    heart.innerHTML =
    ["❤️","💕","💖","💗","💜","💙"]
    [
        Math.floor(
            Math.random()*6
        )
    ];


    heart.style.left =
    Math.random()*100 +
    "%";


    heart.style.animationDuration =
    (4 + Math.random()*4) +
    "s";


    document.body.appendChild(
        heart
    );


    setTimeout(
    ()=>{

        heart.remove();

    },
    8000
    );

}


/* Har 1.5 second mein heart */

setInterval(
    createHeart,
    1500
);
